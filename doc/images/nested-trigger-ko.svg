<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="title description">
  <title id="title">부모와 자식 트리거의 AND 조건 예제</title>
  <desc id="description">오류창 이미지가 있는 부모 아래에 확인 버튼 자식을 배치합니다. 두 이미지를 순서대로 찾았을 때만 자식 버튼을 클릭합니다.</desc>
  <rect width="860" height="390" rx="20" fill="#f4f6fc"/>
  <g font-family="Segoe UI, Malgun Gothic, sans-serif">
    <text x="28" y="40" font-size="22" font-weight="700" fill="#172344">예시: 오류창이 있을 때만 확인 버튼 클릭</text>
    <rect x="24" y="62" width="812" height="196" rx="14" fill="#ffffff" stroke="#dce2f2"/>
    <path d="m46 104 6 6 6-6" fill="none" stroke="#51607c" stroke-width="2"/>
    <rect x="70" y="94" width="22" height="22" rx="4" fill="#0078d4"/>
    <path d="m75 105 4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="110" y="80" width="122" height="54" rx="7" fill="#f0f3ff" stroke="#dce2f2"/>
    <text x="171" y="103" text-anchor="middle" font-size="12" fill="#52617e">오류창 이미지</text>
    <text x="171" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#233458">서버 접속 실패</text>
    <text x="254" y="103" font-size="17" font-weight="700" fill="#172344">부모 A: 오류창 확인</text>
    <text x="254" y="125" font-size="14" fill="#52617e">조건만 확인 · 부모 자체는 클릭하지 않음</text>
    <path d="M80 138v64h30" fill="none" stroke="#bac6e3" stroke-width="2"/>
    <rect x="128" y="180" width="22" height="22" rx="4" fill="#0078d4"/>
    <path d="m133 191 4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="168" y="166" width="122" height="54" rx="7" fill="#fff4df" stroke="#f1cf8c"/>
    <rect x="180" y="181" width="98" height="24" rx="4" fill="#e89011"/>
    <text x="229" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">확인</text>
    <text x="312" y="189" font-size="17" font-weight="700" fill="#172344">자식 B: 확인 버튼 클릭</text>
    <text x="312" y="213" font-size="14" fill="#52617e">부모를 찾은 뒤 자식도 찾았을 때 실행</text>
    <rect x="663" y="170" width="148" height="44" rx="10" fill="#edf2ff"/>
    <text x="737" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#3657cd">Unity: 물리 클릭 ON</text>
    <rect x="24" y="278" width="812" height="60" rx="12" fill="#e8efff"/>
    <text x="430" y="315" text-anchor="middle" font-size="20" font-weight="700" fill="#2847b9">A를 찾음 AND B를 찾음 → B 클릭</text>
    <text x="28" y="368" font-size="14" fill="#52617e">같은 대상 창에서 순서대로 확인하는 예시입니다. 부모 반복: 횟수 / 1회.</text>
  </g>
</svg>
